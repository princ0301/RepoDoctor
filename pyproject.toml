[project]
name = "repodoctor"
version = "0.1.0"
description = "Autonomous GitHub issue triager and fixer built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "langgraph",
    "langchain",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    # LLM providers
    "langchain-google-genai",
    "langchain-openai",
    # Config and CLI
    "pydantic-settings",
    "python-dotenv",
    "typer",
    # Repo, GitHub and sandbox tooling
    "pygithub",
    "gitpython",
    "docker",
]

[project.scripts]
repodoctor = "repodoctor.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repodoctor"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow end-to-end tests (run manually)",
    "docker: needs a running Docker daemon (builds the sandbox image on first run)",
]